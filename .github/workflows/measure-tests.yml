name: measure-tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: CPU info
        run: nproc; lscpu | grep 'Model name'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shm0 \
            libxcb-xinerama0 \
            libxcb-xinput0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            xvfb

      - name: Install dependencies
        run: |
          uv sync --dev --all-extras

      - name: Run tests with coverage
        run: |
          export QT_QPA_PLATFORM=offscreen
          xvfb-run uv run pytest -n logical --durations=0 --cov --cov-report=xml
